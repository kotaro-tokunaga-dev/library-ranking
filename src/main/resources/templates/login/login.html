<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン</title>
  <style>
    body { font-family: sans-serif; background: #f3f5f8; margin: 0; padding: 48px 16px; }
    main { max-width: 360px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 8px; }
    label { display: block; margin-top: 16px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; font-size: 16px; }
    button { margin-top: 24px; width: 100%; padding: 10px; font-size: 16px; }
    .msg { margin: 12px 0 0; font-size: 14px; }
    .error { color: #b3261e; }
  </style>
</head>
<body>
  <main>
    <h1>ログイン</h1>
    <p class="msg error" th:if="${param.error}">ユーザーIDまたはパスワードが違います。</p>
    <p class="msg" th:if="${param.logout}">ログアウトしました。</p>
    <form th:action="@{/login}" method="post">
      <label>ユーザーID
        <input type="text" name="userId" autocomplete="username" required>
      </label>
      <label>パスワード
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit">ログイン</button>
    </form>
    <p class="msg"><a th:href="@{/ranking}">ランキングを見る</a></p>
  </main>
</body>
</html>
